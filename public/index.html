<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06090d">
<meta name="description" content="Jarvis — a quiet, voice-first interface: arc reactor, conversation, permissions and connections.">
<title>JARVIS / Personal Intelligence</title>
<link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body class="minimal-interface" data-brain="claude" data-state="idle">
<main id="jarvis-interface" aria-label="Jarvis conversation">
<section class="hero" aria-label="Arc reactor">
<div class="reactor-zone"><button id="reactor" class="reactor" aria-label="Tap to speak to Jarvis" title="Tap to speak; tap again to stop listening"><span class="orbit"></span><span class="ring ring-a"></span><span class="ring ring-b"></span><span class="ring ring-c"></span><span class="spokes"></span><span class="core"><span></span></span></button></div>
</section>
<section class="command-deck" aria-label="Chat and voice interaction">
<div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
<div id="transcript" class="transcript" aria-live="polite">Tap the reactor to speak, or type and press Enter.</div>
<form id="command-form" class="command-form"><label class="sr-only" for="command">Message Jarvis</label><input id="command" maxlength="4000" required autocomplete="off" placeholder="Message Jarvis…" enterkeyhint="send"></form>
</section>
</main>
<!-- Legacy state and handlers stay mounted, but never appear or receive focus.
     Memory and workspace continue under the hood; they are not main-screen UI. -->
<div id="internal-tools" hidden inert aria-hidden="true">
<header class="topbar"><span id="connection"></span><time id="clock"></time><button id="stop">Stop</button></header>
<div class="hero-copy"><div id="engine"></div></div>
<div class="reactor-label"><span id="state-label"></span><span id="reactor-caption"></span></div><div id="waveform" class="waveform" aria-hidden="true"></div><div class="reactor-foot"><span id="brain-label"></span><span id="voice-status"></span></div>
<div class="telemetry"><strong id="active-count"></strong><strong id="memory-count"></strong><strong id="observation-state"></strong><span id="timezone"></span></div>
<div class="deck-head"><span id="mission-status"></span></div>
<button id="mic" type="button" aria-pressed="false">Microphone</button>
<div class="voice-options"><label><input type="checkbox" id="speak" checked>Spoken replies</label><select id="voice"><option value="">British voice preferred</option></select><button id="interrupt">Interrupt</button><span id="privacy-note"></span></div>
<section class="workspace"><section class="panel"><div id="missions" class="missions"></div></section><section class="panel"><span id="memory-mode"></span><form id="record-form"><select id="record-type"><option>preference</option><option>project</option><option>contact</option><option>decision</option><option>task</option><option>fact</option></select><input id="record-title" required maxlength="160"><textarea id="record-detail" maxlength="4000"></textarea><button type="submit">Save memory</button></form><input id="memory-search"><div id="records" class="records"></div><button id="export-memory">Export</button><input type="file" id="import-memory" accept=".json,.txt,.md"><button id="clear-memory">Clear</button></section></section>
<section class="audit-panel"><div id="audit" class="audit"></div></section>
<nav class="tool-dock"><button id="ear" aria-label="Toggle hands-free listening" aria-pressed="false"><span>◖))</span><small>HANDS-FREE</small></button><button data-tool="calendar">Calendar</button><button data-tool="email">Email</button><button data-tool="calls">Calls</button><button data-tool="documents">Create</button><button data-tool="brains">Brain</button><button data-tool="screen">Observe</button><button data-tool="files">System</button><button data-tool="business">Business</button><button data-tool="registry">Tools</button></nav>
</div>
<dialog id="tool-dialog"><header><h2 id="tool-title"></h2><button id="close-tool" aria-label="Close panel">✕</button></header><div id="tool-content"></div></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title">Confirm action</h2><p id="confirm-detail"></p><div class="local-actions"><button id="confirm-no">Cancel</button><button id="confirm-yes" class="primary">Approve</button></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
