<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Iron Man arc reactor</title>
  <desc id="desc">Metallic red circular armor, four beveled gold fins, twelve illuminated cyan power cells and a white-hot blue core. Dark-mode reference: msg-9c0.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2d0006"/><stop offset=".12" stop-color="#9e0712"/><stop offset=".24" stop-color="#ff5356"/><stop offset=".32" stop-color="#bc0618"/><stop offset=".5" stop-color="#4d000c"/><stop offset=".72" stop-color="#b60918"/><stop offset=".85" stop-color="#ff343a"/><stop offset="1" stop-color="#450008"/>
    </linearGradient>
    <linearGradient id="redPanel" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#39000a"/><stop offset=".25" stop-color="#9e0719"/><stop offset=".47" stop-color="#ef2633"/><stop offset=".57" stop-color="#ff6969"/><stop offset=".66" stop-color="#b80617"/><stop offset="1" stop-color="#55000c"/>
    </linearGradient>
    <radialGradient id="armorShade">
      <stop offset=".72" stop-color="#060a17"/><stop offset=".77" stop-color="#23000b"/><stop offset=".8" stop-color="#ff293d" stop-opacity=".16"/><stop offset=".83" stop-color="#14000a" stop-opacity=".82"/><stop offset=".9" stop-color="#08030a" stop-opacity="0"/><stop offset=".98" stop-color="#050209" stop-opacity=".55"/><stop offset="1" stop-color="#ff7878" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#69411a"/><stop offset=".12" stop-color="#e3c079"/><stop offset=".3" stop-color="#fff2bd"/><stop offset=".47" stop-color="#b8873c"/><stop offset=".64" stop-color="#fff2b5"/><stop offset=".84" stop-color="#bd8c46"/><stop offset="1" stop-color="#563817"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8d6"/><stop offset=".3" stop-color="#f6dc99"/><stop offset=".5" stop-color="#ae7731"/><stop offset=".65" stop-color="#f7d897"/><stop offset=".92" stop-color="#a87537"/><stop offset="1" stop-color="#e8ca85"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172437"/><stop offset=".22" stop-color="#d4eafb"/><stop offset=".32" stop-color="#3a6888"/><stop offset=".55" stop-color="#081e34"/><stop offset=".8" stop-color="#719bb9"/><stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
    <radialGradient id="chamber">
      <stop stop-color="#efffff"/><stop offset=".44" stop-color="#7ff8ff"/><stop offset=".63" stop-color="#079ed8"/><stop offset=".86" stop-color="#005076"/><stop offset="1" stop-color="#001226"/>
    </radialGradient>
    <radialGradient id="cell" cx=".5" cy=".55" r=".8">
      <stop stop-color="#fff"/><stop offset=".48" stop-color="#eaffff"/><stop offset=".7" stop-color="#a3faff"/><stop offset=".9" stop-color="#29d9ff"/><stop offset="1" stop-color="#0398dd"/>
    </radialGradient>
    <radialGradient id="core" cx=".46" cy=".43" r=".64">
      <stop stop-color="#fff"/><stop offset=".58" stop-color="#fff"/><stop offset=".76" stop-color="#dfffff"/><stop offset=".9" stop-color="#75f7ff"/><stop offset="1" stop-color="#06c9ff"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop stop-color="#32ddff" stop-opacity=".7"/><stop offset=".55" stop-color="#00bfff" stop-opacity=".3"/><stop offset="1" stop-color="#0077db" stop-opacity="0"/>
    </radialGradient>
    <filter id="cellGlow" x="-.65" y="-.65" width="2.3" height="2.3" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlow" x="-.6" y="-.6" width="2.2" height="2.2" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="armorQuarter">
      <path d="M229 18 A184 184 0 0 1 382 171 L347 178 A149 149 0 0 0 222 53 Z" fill="url(#redPanel)" stroke="#26020a" stroke-width="1.6"/>
      <path d="M231 24 A178 178 0 0 1 376 169" fill="none" stroke="#ff8b80" stroke-opacity=".55" stroke-width="1.2"/>
      <path d="M226 40 A162 162 0 0 1 360 174" fill="none" stroke="#36010a" stroke-width="3"/>
      <path d="M226 43 A159 159 0 0 1 357 174" fill="none" stroke="#ff5d65" stroke-opacity=".7" stroke-width="1"/>
      <path d="M222 55 A147 147 0 0 1 345 178" fill="none" stroke="#ff3e51" stroke-opacity=".6" stroke-width="1"/>
    </g>
    <g id="fin">
      <path d="M175 16 L225 16 L235 40 L224 76 L217 85 L183 85 L176 76 L165 40 Z" fill="#1b1520" stroke="#140c09" stroke-width="3"/>
      <path d="M176 17 L224 17 L233 40 L222 76 L216 83 L184 83 L178 76 L167 40 Z" fill="url(#gold)" stroke="#eed5a1" stroke-width=".8"/>
      <path d="M184 18 L216 18 L220 40 L214 65 L212 79 L188 79 L186 65 L180 40 Z" fill="url(#goldFace)"/>
      <path d="M181 18 L178 40 L187 77 M219 18 L222 40 L213 77" fill="none" stroke="#5a391d" stroke-width="2.2"/>
      <path d="M185 20 L183 38 L190 64 M215 20 L217 38 L210 64" fill="none" stroke="#fff4c7" stroke-opacity=".7" stroke-width="1.2"/>
      <path d="M186 67 L214 67 L212 80 L188 80 Z" fill="#84d9ed" fill-opacity=".35" stroke="#f5dfaf" stroke-opacity=".6"/>
    </g>
    <g id="powerCell">
      <path d="M179 82 A120 120 0 0 1 221 82 L215 116 A85 85 0 0 0 185 116 Z" fill="url(#steel)" stroke="#001426" stroke-width="2"/>
      <path d="M183 92 A110 110 0 0 1 217 92 L213 111 A90 90 0 0 0 187 111 Z" fill="url(#cell)" stroke="#32dcff" stroke-width="1.4" filter="url(#cellGlow)"/>
      <path d="M184 94 A108 108 0 0 1 216 94" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.4"/>
      <path d="M179 85 L184 114 M221 85 L216 114" fill="none" stroke="#84c7e4" stroke-opacity=".65" stroke-width="1"/>
    </g>
  </defs>
  <circle cx="200" cy="200" r="187" fill="#07060c"/>
  <circle cx="200" cy="200" r="184" fill="url(#red)" stroke="#590b17" stroke-width="1"/>
  <use href="#armorQuarter"/><use href="#armorQuarter" transform="rotate(90 200 200)"/><use href="#armorQuarter" transform="rotate(180 200 200)"/><use href="#armorQuarter" transform="rotate(270 200 200)"/>
  <circle cx="200" cy="200" r="183" fill="url(#armorShade)"/>
  <circle cx="200" cy="200" r="145" fill="#100b1b" stroke="#ff455b" stroke-opacity=".45" stroke-width="1.2"/>
  <circle cx="200" cy="200" r="134" fill="url(#steel)" stroke="#020a17" stroke-width="2"/>
  <circle cx="200" cy="200" r="130" fill="#061b30" stroke="#71bbdb" stroke-width="1.2"/>
  <circle cx="200" cy="200" r="125" fill="#05192c" stroke="url(#steel)" stroke-width="6"/>
  <circle cx="200" cy="200" r="121" fill="url(#chamber)" stroke="#29bcef" stroke-opacity=".8" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="117" fill="#022641"/>
  <use href="#powerCell"/><use href="#powerCell" transform="rotate(30 200 200)"/><use href="#powerCell" transform="rotate(60 200 200)"/><use href="#powerCell" transform="rotate(90 200 200)"/><use href="#powerCell" transform="rotate(120 200 200)"/><use href="#powerCell" transform="rotate(150 200 200)"/><use href="#powerCell" transform="rotate(180 200 200)"/><use href="#powerCell" transform="rotate(210 200 200)"/><use href="#powerCell" transform="rotate(240 200 200)"/><use href="#powerCell" transform="rotate(270 200 200)"/><use href="#powerCell" transform="rotate(300 200 200)"/><use href="#powerCell" transform="rotate(330 200 200)"/>
  <circle cx="200" cy="200" r="84" fill="url(#chamber)" stroke="#42dbff" stroke-width="1.3"/>
  <circle cx="200" cy="200" r="77" fill="none" stroke="#2bd8ff" stroke-opacity=".55" stroke-width="1"/>
  <circle cx="200" cy="200" r="69" fill="none" stroke="#5be7ff" stroke-opacity=".22" stroke-width="2"/>
  <g fill="none" stroke="#78f7ff" stroke-opacity=".3" stroke-width=".8">
    <path d="M200 78 V322 M78 200 H322"/>
    <path d="M158 127 L242 273 M127 158 L273 242 M127 242 L273 158 M158 273 L242 127"/>
  </g>
  <circle cx="200" cy="200" r="84" fill="url(#aura)"/>
  <circle cx="200" cy="200" r="57" fill="#10d1ff" fill-opacity=".35" stroke="#79faff" stroke-width="1.5" filter="url(#coreGlow)"/>
  <circle cx="200" cy="200" r="54" fill="url(#core)" filter="url(#coreGlow)"/>
  <circle cx="200" cy="200" r="55" fill="none" stroke="#b8ffff" stroke-width="1"/>
  <path d="M113 111 A124 124 0 0 1 288 112 M89 254 A124 124 0 0 0 280 295" fill="none" stroke="#c4f6ff" stroke-opacity=".8" stroke-width="2.2"/>
  <path d="M106 113 A127 127 0 0 1 158 80" fill="none" stroke="#fff" stroke-width="2" filter="url(#cellGlow)"/>
  <use href="#fin"/><use href="#fin" transform="rotate(90 200 200)"/><use href="#fin" transform="rotate(180 200 200)"/><use href="#fin" transform="rotate(270 200 200)"/>
</svg>
